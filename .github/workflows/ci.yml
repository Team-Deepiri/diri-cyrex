name: Deepiri CI - diri-cyrex

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4

      - name: Init submodules
        run: |
          set -euo pipefail
          TOKEN="${{ secrets.DEEPIRI_CI_CLONE_PAT || secrets.GITHUB_TOKEN }}"
          git config --global --add url."https://x-access-token:${TOKEN}@github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://x-access-token:${TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule sync --recursive
          git submodule update --init --recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: |
          poetry install --with dev
          poetry run pip install ./diri-agent-testing-utils

      - name: Verify modelkit matches poetry.lock (sidecar_utils)
        run: |
          poetry run python - <<'PY'
          import importlib.metadata as md
          import re
          import subprocess

          from deepiri_modelkit.streaming.sidecar_utils import env_float

          show = subprocess.check_output(
              ["poetry", "show", "deepiri-modelkit"],
              text=True,
              stderr=subprocess.STDOUT,
          )
          match = re.search(r"^\s*version\s*:\s*(\S+)", show, re.MULTILINE)
          if not match:
              raise SystemExit(f"could not parse poetry show output:\n{show}")
          expected = match.group(1).strip()
          installed = md.version("deepiri-modelkit")
          if installed != expected:
              raise SystemExit(
                  f"deepiri-modelkit mismatch: poetry.lock resolves to {expected}, "
                  f"installed {installed}. Run poetry lock && poetry install."
              )
          print(f"deepiri-modelkit {installed} matches poetry.lock")
          assert env_float("MISSING", 1.0) == 1.0
          PY

      - name: Undefined names on API boot paths
        run: |
          poetry run ruff check --select F821 \
            app/routes/artifacts.py \
            app/integrations/streaming \
            app/services/knowledge_retrieval_engine.py \
            app/services/contextual_ability_engine.py

      - name: App import smoke (uvicorn entrypoint)
        env:
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          MILVUS_HOST: localhost
          MILVUS_PORT: "19530"
          CYREX_API_KEY: ci-smoke-test-key-not-a-real-secret
        run: |
          poetry run python -c "from app.main import app; assert app.title"

      - name: Ruff
        run: poetry run ruff check app/mcp app/pipeline app/training tests/contract tests/mcp tests/pipeline tests/routes tests/training tests/fakes

      - name: Cross-track import gate
        run: poetry run python scripts/ci/check_cross_track_imports.py

      - name: Unit tests
        env:
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          MILVUS_HOST: localhost
          MILVUS_PORT: "19530"
          CYREX_API_KEY: ci-smoke-test-key-not-a-real-secret
        run: poetry run pytest --confcutdir=tests/contract tests/contract tests/mcp tests/routes/test_pressure.py -q
