name: Deepiri CI - diri-cyrex

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4

      - name: Init submodules
        run: |
          set -euo pipefail
          TOKEN="${{ secrets.DEEPIRI_CI_CLONE_PAT || secrets.GITHUB_TOKEN }}"
          git config --global --add url."https://x-access-token:${TOKEN}@github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://x-access-token:${TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule sync --recursive
          git submodule update --init --recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: |
          poetry install --with dev
          poetry run pip install ./diri-agent-testing-utils

      - name: Verify modelkit pin (sidecar_utils)
        run: |
          poetry run python - <<'PY'
          import importlib.metadata as md
          from deepiri_modelkit.streaming.sidecar_utils import env_float
          ver = md.version("deepiri-modelkit")
          print(f"deepiri-modelkit {ver}")
          assert tuple(int(x) for x in ver.split(".")[:3]) >= (0, 2, 1), (
              f"expected deepiri-modelkit>=0.2.1 (sidecar_utils), got {ver}"
          )
          assert env_float("MISSING", 1.0) == 1.0
          PY

      - name: Undefined names on API boot paths
        run: |
          poetry run ruff check --select F821 \
            app/routes/artifacts.py \
            app/integrations/streaming \
            app/services/knowledge_retrieval_engine.py \
            app/services/contextual_ability_engine.py

      - name: App import smoke (uvicorn entrypoint)
        env:
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          MILVUS_HOST: localhost
          MILVUS_PORT: "19530"
          CYREX_API_KEY: change-me
        run: |
          poetry run python -c "from app.main import app; assert app.title"

      - name: Ruff
        run: poetry run ruff check app/pipeline app/training tests/contract tests/pipeline tests/training tests/fakes

      - name: Unit tests
        env:
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          MILVUS_HOST: localhost
          MILVUS_PORT: "19530"
          CYREX_API_KEY: change-me
        run: poetry run pytest tests/contract -q
